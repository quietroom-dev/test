<html>
<head>
  <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

  <style>
    .rec-btn {
  position: fixed;
  bottom: 200px;
  left: 50%;
  transform: translateX(-50%);
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: black;
  border: 4px solid white;
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

.cta-btn {
  position: fixed;
  bottom: 120px;     /* 好きな高さに調整 */
  left: 50%;
  transform: translateX(-50%);
  background-color: #ff8800;   /* オレンジ */
  color: #ffffff;              /* 白文字 */
  border: none;
  border-radius: 999px;        /* 角を丸く（横長カプセル） */
  padding: 12px 28px;          /* 横長にする */
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

/* 必要ならホバー時 */
.cta-btn:active,
.cta-btn:hover {
  background-color: #ff9900;
}
body {
  background-image: url("IMG_4318.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
  </style>
</head>
<body style="margin:0; background:white;">
<video id="preview" autoplay playsinline style="width:100%; height:100%; object-fit:cover;"></video>

<button id="startRec" class="rec-btn"></button>
<button id="stopBtn" class="cta-btn">無料アプリで見る</button>

<script>
let stream;
let recorder;
let chunks = [];

// カメラ起動（外カメラ）
async function startCamera() {
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" },
    audio: true
  });
  video.muted = true;
  video.volume = 0;
  document.getElementById("preview").srcObject = stream;
}

// 録画開始
document.getElementById("startRec").onclick = () => {
document.getElementById("startRec").style.display = "none";
document.getElementById("stopBtn").style.display = "block";
  chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: "video/webm" });
  recorder.ondataavailable = e => chunks.push(e.data);

  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: "video/webm" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "recorded.webm";
    a.click();
    
document.getElementById("startRec").style.display = "block";
document.getElementById("stopBtn").style.display = "none";
  };
  recorder.start();
};

// 録画停止
document.getElementById("stopBtn").onclick = () => recorder.stop();

startCamera();
</script>

</body>
</html>
