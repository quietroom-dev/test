<html>
<head>
  <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

  <style>
    .rec-btn {
  position: fixed;
  bottom: 200px;
  left: 50%;
  transform: translateX(-50%);
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: black;
  border: 4px solid white;
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

.stop-btn {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: black;
  border: 4px solid black;
  display: none;
}
  </style>
</head>
<body style="margin:0; background:black;">

<video id="preview" autoplay playsinline style="width:100%; height:100%; object-fit:cover;"></video>

<button id="startRec" class="rec-btn"></button>
<button id="stopRec" class="stop-btn"></button>

<script>
let stream;
let recorder;
let chunks = [];

// カメラ起動（外カメラ）
async function startCamera() {
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" },
    audio: true
  });
  video.muted = true;
  video.volume = 0;
  document.getElementById("preview").srcObject = stream;
}

// 録画開始
document.getElementById("startRec").onclick = () => {
document.getElementById("startRec").style.display = "none";
document.getElementById("stopRec").style.display = "block";
  chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: "video/webm" });
  recorder.ondataavailable = e => chunks.push(e.data);

  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: "video/webm" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "recorded.webm";
    a.click();
    
document.getElementById("startRec").style.display = "block";
document.getElementById("stopRec").style.display = "none";
  };
  recorder.start();
};

// 録画停止
document.getElementById("stopRec").onclick = () => recorder.stop();

startCamera();
</script>

</body>
</html>
